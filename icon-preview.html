<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Icon 图标预览</title>
        <style>
            :root {
                --bg: #0f1115;
                --panel: #171a21;
                --panel-2: #1c2028;
                --border: #2a2f3a;
                --text: #e6e9ef;
                --muted: #8b93a1;
                --accent: #4c8dff;
                --hover: #232834;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family:
                    -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei",
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                padding: 32px 24px 64px;
            }
            header {
                max-width: 1200px;
                margin: 0 auto 24px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                flex-wrap: wrap;
            }
            h1 {
                font-size: 22px;
                font-weight: 600;
            }
            h1 small {
                color: var(--muted);
                font-weight: 400;
                font-size: 14px;
                margin-left: 8px;
            }
            .search {
                flex: 1;
                min-width: 220px;
                max-width: 360px;
                position: relative;
            }
            .search input {
                width: 100%;
                padding: 10px 14px 10px 38px;
                border-radius: 10px;
                border: 1px solid var(--border);
                background: var(--panel);
                color: var(--text);
                font-size: 14px;
                outline: none;
            }
            .search input:focus {
                border-color: var(--accent);
            }
            .search svg {
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--muted);
            }
            .grid {
                max-width: 1200px;
                margin: 0 auto;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 12px;
            }
            .card {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 18px 14px 14px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                cursor: pointer;
                transition:
                    transform 0.15s,
                    border-color 0.15s,
                    background 0.15s;
                user-select: none;
            }
            .card:hover {
                transform: translateY(-2px);
                border-color: var(--accent);
                background: var(--panel-2);
            }
            .card .icon {
                color: var(--text);
            }
            .card .name {
                font-size: 13px;
                font-weight: 500;
                font-family: "SF Mono", Consolas, monospace;
            }
            .card .path {
                font-size: 10px;
                color: var(--muted);
                text-align: center;
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                line-height: 1.4;
            }
            .empty {
                grid-column: 1 / -1;
                text-align: center;
                color: var(--muted);
                padding: 60px 0;
            }
            #toast {
                position: fixed;
                left: 50%;
                bottom: 32px;
                transform: translateX(-50%) translateY(20px);
                background: var(--panel-2);
                border: 1px solid var(--border);
                padding: 10px 18px;
                border-radius: 10px;
                font-size: 13px;
                opacity: 0;
                pointer-events: none;
                transition:
                    opacity 0.2s,
                    transform 0.2s;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            }
            #toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        </style>
    </head>
    <body>
        <header>
            <h1>
                Icon 图标预览<small
                    >共 <span id="count"></span> 个 · 点击卡片复制名称</small
                >
            </h1>
            <div class="search">
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                >
                    <path
                        d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm10 2-4.3-4.3"
                    />
                </svg>
                <input
                    id="filter"
                    type="text"
                    placeholder="搜索图标名称…"
                    autocomplete="off"
                />
            </div>
        </header>

        <div class="grid" id="grid"></div>
        <div id="toast"></div>

        <script>

                {

                    path: "M9.56 10.36h11.25c0.1 0 0.19-0.08 0.19-0.19v-1.31c0-0.1-0.08-0.19-0.19-0.19H9.56c-0.1 0-0.19 0.08-0.19 0.19v1.31c0 0.1 0.08 0.19 0.19 0.19zm-0.19 4.78c0 0.1 0.08 0.19 0.19 0.19h11.25c0.1 0 0.19-0.08 0.19-0.19v-1.31c0-0.1-0.08-0.19-0.19-0.19H9.56c-0.1 0-0.19 0.08-0.19 0.19v1.31zm11.81-11.39H2.81c-0.1 0-0.19 0.08-0.19 0.19v1.31c0 0.1 0.08 0.19 0.19 0.19h18.38c0.1 0 0.19-0.08 0.19-0.19v-1.31c0-0.1-0.08-0.19-0.19-0.19zm0 14.81H2.81c-0.1 0-0.19 0.08-0.19 0.19v1.31c0 0.1 0.08 0.19 0.19 0.19h18.38c0.1 0 0.19-0.08 0.19-0.19v-1.31c0-0.1-0.08-0.19-0.19-0.19zM3.34 15.05L7 12.16a0.21 0.21 0 0 0 0-0.33L3.34 8.95c-0.14-0.11-0.34-0.01-0.34 0.16v5.77a0.21 0.21 0 0 0 0.34 0.16z",
                    fill: true,
                },
                {
                    name: "menuFold",
                    path: "M9.56 10.36h11.25c0.1 0 0.19-0.08 0.19-0.19v-1.31c0-0.1-0.08-0.19-0.19-0.19H9.56c-0.1 0-0.19 0.08-0.19 0.19v1.31c0 0.1 0.08 0.19 0.19 0.19zm-0.19 4.78c0 0.1 0.08 0.19 0.19 0.19h11.25c0.1 0 0.19-0.08 0.19-0.19v-1.31c0-0.1-0.08-0.19-0.19-0.19H9.56c-0.1 0-0.19 0.08-0.19 0.19v1.31zm11.81-11.39H2.81c-0.1 0-0.19 0.08-0.19 0.19v1.31c0 0.1 0.08 0.19 0.19 0.19h18.38c0.1 0 0.19-0.08 0.19-0.19v-1.31c0-0.1-0.08-0.19-0.19-0.19zm0 14.81H2.81c-0.1 0-0.19 0.08-0.19 0.19v1.31c0 0.1 0.08 0.19 0.19 0.19h18.38c0.1 0 0.19-0.08 0.19-0.19v-1.31c0-0.1-0.08-0.19-0.19-0.19zM2.7 12.16L6.37 15.05c0.14 0.11 0.34 0.01 0.34-0.16V9.11c0-0.17-0.2-0.27-0.34-0.16L2.7 11.84a0.2 0.2 0 0 0 0 0.32z",
                    fill: true,
                },
            ];

            const grid = document.getElementById("grid");
            const filter = document.getElementById("filter");
            const count = document.getElementById("count");
            const toastEl = document.getElementById("toast");
            let timer = null;

            count.textContent = ICONS.length;

            function svgFor(icon, size) {
                const paint = icon.fill
                    ? 'fill="currentColor" stroke="none"'
                    : 'fill="none" stroke="currentColor"';
                return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" ${paint}
    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="${icon.path}" /></svg>`;
            }

            function render(keyword = "") {
                const list = ICONS.filter((icon) =>
                    icon.name.includes(keyword.toLowerCase()),
                );
                if (!list.length) {
                    grid.innerHTML = '<div class="empty">没有匹配的图标</div>';
                    return;
                }
                grid.innerHTML = list
                    .map(
                        (icon) => `
      <div class="card" data-name="${icon.name}" title="点击复制图标名称">
        <span class="icon">${svgFor(icon, 44)}</span>
        <span class="name">${icon.name}</span>
        <span class="path">${icon.path}</span>
      </div>`,
                    )
                    .join("");
            }

            function showToast(text) {
                toastEl.textContent = text;
                toastEl.classList.add("show");
                clearTimeout(timer);
                timer = setTimeout(
                    () => toastEl.classList.remove("show"),
                    1600,
                );
            }

            filter.addEventListener("input", () => render(filter.value));
            grid.addEventListener("click", (event) => {
                const card = event.target.closest(".card");
                if (!card) return;
                const name = card.dataset.name;
                navigator.clipboard?.writeText(name).then(
                    () => showToast(`已复制图标名称：${name}`),
                    () => showToast(`图标名称：${name}`),
                );
            });

            render();
        </script>
    </body>
</html>
